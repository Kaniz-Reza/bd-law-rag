[project]
name = "bd-law-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "sentence-transformers>=6.1.0",
    "faiss-cpu>=1.15.1",
    "rank-bm25>=0.2.2",
    "google-genai>=2.25.0",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pre-commit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
